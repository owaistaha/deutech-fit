<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.22"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="flag"><circle cx="97" cy="97" r="16"/></clipPath>
  </defs>
  <!-- tile -->
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#bg)"/>
  <rect x="6" y="6" width="116" height="116" rx="28" fill="url(#shine)"/>
  <!-- check mark ("fit") -->
  <path d="M31 63 L52 84 L92 41" fill="none" stroke="#FFFFFF" stroke-width="15"
        stroke-linecap="round" stroke-linejoin="round"/>
  <!-- German flag badge -->
  <circle cx="97" cy="97" r="20.5" fill="#FFFFFF"/>
  <g clip-path="url(#flag)">
    <rect x="81" y="81" width="32" height="10.67" fill="#111111"/>
    <rect x="81" y="91.67" width="32" height="10.67" fill="#DD0000"/>
    <rect x="81" y="102.33" width="32" height="10.67" fill="#FFCE00"/>
  </g>
</svg>
